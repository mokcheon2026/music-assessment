<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>음악 수행평가 곡 선정</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&family=Bebas+Neue&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a12; --surface: #13131f; --surface2: #1c1c2e;
    --accent: #7c6fff; --accent2: #ff6b9d; --gold: #ffd166;
    --text: #f0eeff; --text2: #9b97c0; --border: rgba(124,111,255,0.2);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--text);
    font-family: 'Noto Sans KR', sans-serif;
    min-height: 100vh; display: flex; flex-direction: column;
    align-items: center; justify-content: center; overflow-x: hidden;
  }
  body::before {
    content: ''; position: fixed; top: -50%; left: -50%; width: 200%; height: 200%;
    background: radial-gradient(ellipse at 30% 20%, rgba(124,111,255,0.08) 0%, transparent 50%),
                radial-gradient(ellipse at 70% 80%, rgba(255,107,157,0.06) 0%, transparent 50%);
    pointer-events: none; z-index: 0;
  }
  .page { position: relative; z-index: 1; width: 100%; max-width: 520px; padding: 2rem 1.5rem; }
  .header { text-align: center; margin-bottom: 3rem; }
  .header-badge {
    display: inline-block; background: rgba(124,111,255,0.15);
    border: 1px solid var(--border); border-radius: 50px;
    padding: 0.3rem 1.1rem; font-size: 0.72rem; letter-spacing: 0.15em;
    color: var(--accent); margin-bottom: 1rem; text-transform: uppercase;
  }
  .header h1 {
    font-family: 'Bebas Neue', sans-serif; font-size: 3.2rem;
    letter-spacing: 0.05em; line-height: 1;
    background: linear-gradient(135deg, #fff 0%, var(--accent) 60%, var(--accent2) 100%);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 0.6rem;
  }
  .header p { font-size: 0.85rem; color: var(--text2); }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 20px; padding: 2rem; margin-bottom: 1rem; }
  .form-group { margin-bottom: 1.4rem; }
  label { display: block; font-size: 0.78rem; font-weight: 500; color: var(--text2); margin-bottom: 0.5rem; letter-spacing: 0.05em; }
  input[type="text"] {
    width: 100%; background: var(--surface2); border: 1px solid var(--border);
    border-radius: 10px; padding: 0.8rem 1rem; color: var(--text);
    font-size: 1rem; font-family: 'Noto Sans KR', sans-serif; outline: none; transition: border-color 0.2s;
  }
  input[type="text"]:focus { border-color: var(--accent); }
  input[type="text"]::placeholder { color: rgba(155,151,192,0.4); }
  .hint {
    font-size: 0.73rem; color: var(--text2); margin-top: 0.4rem;
    padding: 0.5rem 0.8rem; background: rgba(255,209,102,0.07);
    border-left: 2px solid var(--gold); border-radius: 0 6px 6px 0;
  }
  .btn-primary {
    width: 100%; padding: 0.9rem;
    background: linear-gradient(135deg, var(--accent), #5a4dff);
    border: none; border-radius: 12px; color: #fff; font-size: 1rem;
    font-weight: 700; font-family: 'Noto Sans KR', sans-serif;
    cursor: pointer; letter-spacing: 0.05em; transition: opacity 0.2s, transform 0.1s;
  }
  .btn-primary:hover { opacity: 0.9; }
  .btn-primary:active { transform: scale(0.98); }
  #wheel-section { display: none; text-align: center; }
  .student-info-bar {
    display: flex; align-items: center; gap: 1rem;
    background: var(--surface2); border: 1px solid var(--border);
    border-radius: 12px; padding: 0.8rem 1.2rem; margin-bottom: 2rem; font-size: 0.85rem;
  }
  .student-info-bar span { color: var(--text2); }
  .student-info-bar strong { color: var(--accent); }
  .status-dot {
    display: inline-block; width: 7px; height: 7px; border-radius: 50%;
    background: #06d6a0; animation: pulse 2s infinite;
  }
  .wheel-wrap { position: relative; width: 320px; height: 320px; margin: 0 auto 1.5rem; }
  .wheel-pointer {
    position: absolute; top: -16px; left: 50%; transform: translateX(-50%);
    width: 0; height: 0; border-left: 14px solid transparent;
    border-right: 14px solid transparent; border-top: 28px solid var(--gold);
    filter: drop-shadow(0 2px 6px rgba(255,209,102,0.5)); z-index: 10;
  }
  #wheelCanvas { border-radius: 50%; box-shadow: 0 0 40px rgba(124,111,255,0.3); }
  .spin-info { font-size: 0.8rem; color: var(--text2); margin-bottom: 1.5rem; }
  .spin-info .chance {
    display: inline-block; background: rgba(255,107,157,0.15); color: var(--accent2);
    border: 1px solid rgba(255,107,157,0.3); border-radius: 20px;
    padding: 0.15rem 0.7rem; font-size: 0.75rem; margin-left: 0.5rem;
  }
  .btn-spin {
    padding: 0.85rem 3rem;
    background: linear-gradient(135deg, var(--accent2), #c0416d);
    border: none; border-radius: 50px; color: #fff; font-size: 1.05rem;
    font-weight: 700; font-family: 'Noto Sans KR', sans-serif;
    cursor: pointer; letter-spacing: 0.08em; transition: opacity 0.2s, transform 0.1s;
    box-shadow: 0 4px 20px rgba(255,107,157,0.3);
  }
  .btn-spin:hover { opacity: 0.9; }
  .btn-spin:active { transform: scale(0.97); }
  .btn-spin:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
  #result-section { display: none; text-align: center; }
  .result-badge {
    display: inline-block; font-size: 0.7rem; letter-spacing: 0.12em;
    text-transform: uppercase; color: var(--gold);
    background: rgba(255,209,102,0.1); border: 1px solid rgba(255,209,102,0.25);
    border-radius: 30px; padding: 0.25rem 0.9rem; margin-bottom: 1.2rem;
  }
  .result-song {
    font-family: 'Bebas Neue', sans-serif; font-size: 2.6rem; letter-spacing: 0.04em;
    background: linear-gradient(135deg, var(--gold), var(--accent2));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    margin-bottom: 0.5rem; line-height: 1.1;
  }
  .result-sub { font-size: 0.82rem; color: var(--text2); margin-bottom: 1.5rem; }
  .result-note {
    font-size: 0.78rem; color: var(--text2); padding: 0.8rem;
    background: rgba(124,111,255,0.06); border: 1px solid var(--border); border-radius: 10px;
  }
  #loading-msg { display: none; font-size: 0.8rem; color: var(--text2); margin-top: 0.8rem; animation: pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 0%,100%{opacity:0.4} 50%{opacity:1} }
  .no-songs-msg { text-align: center; padding: 2rem; color: var(--text2); font-size: 0.9rem; }
</style>
</head>
<body>
<div class="page">
  <div class="header">
    <div class="header-badge">🎵 Music Performance</div>
    <h1>음악 수행평가<br>곡 선정</h1>
    <p>돌림판을 돌려 나의 시험 곡을 뽑아보세요</p>
  </div>

  <div id="login-section" class="card">
    <div class="form-group">
      <label>이름</label>
      <input type="text" id="input-name" placeholder="홍길동" maxlength="10">
    </div>
    <div class="form-group">
      <label>학번</label>
      <input type="text" id="input-id" placeholder="예: 1120" maxlength="6">
      <div class="hint">💡 1학년 1반 20번 → <strong>1120</strong> 으로 입력하세요</div>
    </div>
    <button class="btn-primary" onclick="handleLogin()">입장하기</button>
  </div>

  <div id="wheel-section">
    <div class="student-info-bar">
      <span class="status-dot"></span>
      <span>학생</span><strong id="bar-name"></strong>
      <span>·</span><span id="bar-id"></span>
    </div>
    <div class="card">
      <div id="no-songs-msg" class="no-songs-msg" style="display:none">
        ⏳ 선생님이 아직 곡을 등록하지 않았습니다.<br>잠시 후 새로고침 해주세요.
      </div>
      <div id="wheel-content">
        <div class="wheel-wrap">
          <div class="wheel-pointer"></div>
          <canvas id="wheelCanvas" width="320" height="320"></canvas>
        </div>
        <p class="spin-info">돌림판을 돌려 곡을 선정하세요<span class="chance">기회 1회</span></p>
        <button class="btn-spin" id="spinBtn" onclick="spinWheel()">🎲 돌리기</button>
        <p id="loading-msg">기록 저장 중...</p>
      </div>
    </div>
  </div>

  <div id="result-section" class="card">
    <div class="result-badge">✨ 선정 완료</div>
    <div class="result-song" id="result-song-name"></div>
    <p class="result-sub" id="result-student-info"></p>
    <p class="result-note">이 결과는 선생님 서버에 자동으로 기록되었습니다.<br>페이지를 새로고침해도 결과는 변경되지 않습니다.</p>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, get, set, onValue } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyAFsOg3VEMEkU4RohjMAzws2MjwiXyaRYI",
  authDomain: "music-evalutation.firebaseapp.com",
  databaseURL: "https://music-evalutation-default-rtdb.firebaseio.com",
  projectId: "music-evalutation",
  storageBucket: "music-evalutation.firebasestorage.app",
  messagingSenderId: "326493256601",
  appId: "1:326493256601:web:338cc3efa60ce01c64f108"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const COLORS = [
  ['#7c6fff','#fff'],['#ff6b9d','#fff'],['#ffd166','#1a1a2e'],
  ['#06d6a0','#1a1a2e'],['#ef476f','#fff'],['#118ab2','#fff'],
  ['#8338ec','#fff'],['#fb5607','#fff'],['#3a86ff','#fff'],['#ffb703','#1a1a2e']
];

let songs = [];
let currentStudent = null;
let spinning = false;

onValue(ref(db, 'songs'), (snap) => {
  songs = snap.exists() ? Object.values(snap.val()) : [];
  if (currentStudent) refreshWheelUI();
});

window.handleLogin = async function() {
  const name = document.getElementById('input-name').value.trim();
  const id = document.getElementById('input-id').value.trim();
  if (!name) { alert('이름을 입력해주세요.'); return; }
  if (!id || id.length < 3) { alert('학번을 올바르게 입력해주세요.\n예: 1학년 1반 20번 → 1120'); return; }
  currentStudent = { name, id };
  document.getElementById('bar-name').textContent = name;
  document.getElementById('bar-id').textContent = id;
  document.getElementById('login-section').style.display = 'none';
  const snap = await get(ref(db, 'results/' + id));
  if (snap.exists()) {
    const r = snap.val();
    showResultScreen(r.song, r.name, r.studentId);
    return;
  }
  document.getElementById('wheel-section').style.display = 'block';
  refreshWheelUI();
};

function refreshWheelUI() {
  if (songs.length === 0) {
    document.getElementById('no-songs-msg').style.display = 'block';
    document.getElementById('wheel-content').style.display = 'none';
  } else {
    document.getElementById('no-songs-msg').style.display = 'none';
    document.getElementById('wheel-content').style.display = 'block';
    drawWheel(0);
  }
}

function drawWheel(angle) {
  const canvas = document.getElementById('wheelCanvas');
  if (!canvas || songs.length === 0) return;
  const ctx = canvas.getContext('2d');
  const cx = 160, cy = 160, r = 155, n = songs.length;
  const slice = (2 * Math.PI) / n;
  ctx.clearRect(0, 0, 320, 320);
  for (let i = 0; i < n; i++) {
    const start = angle + i * slice - Math.PI / 2;
    const [bg, fg] = COLORS[i % COLORS.length];
    ctx.beginPath(); ctx.moveTo(cx, cy);
    ctx.arc(cx, cy, r, start, start + slice); ctx.closePath();
    ctx.fillStyle = bg; ctx.fill();
    ctx.strokeStyle = 'rgba(10,10,18,0.6)'; ctx.lineWidth = 2; ctx.stroke();
    ctx.save(); ctx.translate(cx, cy); ctx.rotate(start + slice / 2);
    ctx.textAlign = 'right'; ctx.fillStyle = fg;
    ctx.font = `${Math.min(13, 240/n)}px 'Noto Sans KR', sans-serif`;
    ctx.fillText(songs[i].length > 8 ? songs[i].slice(0,8)+'…' : songs[i], r - 12, 5);
    ctx.restore();
  }
  ctx.beginPath(); ctx.arc(cx, cy, 22, 0, 2*Math.PI);
  ctx.fillStyle = '#0a0a12'; ctx.fill();
  ctx.strokeStyle = 'rgba(124,111,255,0.4)'; ctx.lineWidth = 2; ctx.stroke();
  ctx.fillStyle = '#7c6fff'; ctx.font = 'bold 18px sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('♪', cx, cy);
}

window.spinWheel = function() {
  if (spinning || songs.length === 0) return;
  spinning = true;
  document.getElementById('spinBtn').disabled = true;
  const target = Math.PI * 2 * (8 + Math.floor(Math.random() * 6)) + Math.random() * Math.PI * 2;
  const duration = 4500, start = performance.now();
  const easeOut = t => 1 - Math.pow(1 - t, 4);
  let finalAngle = 0;
  function animate(now) {
    const p = Math.min((now - start) / duration, 1);
    finalAngle = easeOut(p) * target;
    drawWheel(finalAngle);
    if (p < 1) { requestAnimationFrame(animate); return; }
    const slice = (Math.PI * 2) / songs.length;
    const ptr = (Math.PI * 2 - finalAngle % (Math.PI * 2)) % (Math.PI * 2);
    finishSpin(songs[Math.floor(ptr / slice) % songs.length]);
  }
  requestAnimationFrame(animate);
};

async function finishSpin(song) {
  document.getElementById('loading-msg').style.display = 'block';
  const id = currentStudent.id;
  const data = {
    studentId: id, name: currentStudent.name, song,
    grade: id[0]||'?', cls: id[1]||'?', num: id.slice(2)||'?',
    timestamp: new Date().toLocaleString('ko-KR')
  };
  await set(ref(db, 'results/' + id), data);
  showResultScreen(song, currentStudent.name, id);
}

function showResultScreen(song, name, id) {
  document.getElementById('wheel-section').style.display = 'none';
  document.getElementById('result-section').style.display = 'block';
  document.getElementById('result-song-name').textContent = song;
  document.getElementById('result-student-info').textContent = `${name} (학번: ${id})`;
}
</script>
</body>
</html>
